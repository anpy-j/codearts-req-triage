# 分诊规则示例 — 复制为 rules.yaml 后按项目实际情况修改

# 模块分类：关键词命中（标题+描述）即归入该模块，先命中优先
module_keywords:
  auth: [登录, 登出, 认证, 鉴权, token, 权限不足, 403, session, 密码, 验证码]
  payment: [支付, 订单, 退款, 金额, 余额, 发票, 交易, 扣款]
  order: [下单, 购物车, 结算, 库存, 商品, sku, 发货, 物流]
  message: [通知, 短信, 邮件, 推送, 消息, 站内信, 提醒]
  data: [报表, 导出, 统计, 图表, 数据不一致, 查询慢, 汇总]
  upload: [上传, 附件, 图片, 文件, obs, 存储, 下载]
  api: [接口, api, 超时, 500, 502, 504, 网关, 报错, 崩溃, 异常]
  ui: [页面, 样式, 前端, 白屏, 布局, 点击无反应, 显示异常, 错位]

# 严重级 → 建议优先级（P0..P4，需与 Req 项目 priority id 映射确认）
severity_priority:
  # Req 内置严重级名称（以项目实际为准）：致命/严重/一般/轻微
  fatal: P0
  致命: P0
  critical: P1
  严重: P1
  normal: P2
  一般: P2
  minor: P3
  轻微: P3

# 影响面/关键词升级规则：命中任一关键词则优先级提升到该档
priority_upgrade:
  P0: [崩溃, 数据丢失, 安全漏洞, 资金, 全部用户不可用, 无法登录]
  P1: [核心功能不可用, 大面积报错, 性能严重劣化, 主流程]

# 模块 → 负责人建议（姓名 → Req 用户数字 id 的映射需成员提供）
assignee_map:
  auth: 张三
  payment: 李四
  order: 李四
  message: 王五
  data: 王五
  upload: 赵六
  api: 赵六
  ui: 孙七

# ===== 自动改字段所需的 id 映射（默认关闭 AUTO_CHANGE_*，开启时才使用）=====
# 映射缺失或未开启对应 AUTO_CHANGE_* 时，该字段不会被自动修改。
# 这些 id 是 Req 项目中「重要程度/优先级/模块/用户」的实际数字 id，需成员提供。
# severity_id_map:  # 重要程度 id（键与 severity_priority 一致：先小写归一，如 {致命: 1, 严重: 2, 一般: 3, 轻微: 4} 或 {fatal: 1}）
# priority_id_map:  # 优先级 id：如 {P0: 1, P1: 2, P2: 3, P3: 4, P4: 5}
# module_id_map:    # 模块 id：如 {auth: 1001, payment: 1002}
# assignee_id_map:  # 负责人 id：如 {张三: 20001, 李四: 20002}

# 未命中任何模块时的兜底模块
default_module: other

# 规则版本号（写入分诊结论，便于追溯）
rule_version: "1.0"
